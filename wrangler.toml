name = "dophuc-ai"
main = "src/index.js"
compatibility_date = "2026-10-16"
workers_dev = true

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dophuc-ai-db"
database_id = "ec978717-6cf0-4a18-b6f8-32d81799194e"
migrations_dir = "migrations"

[ai]
binding = "AI"
